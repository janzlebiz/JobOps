name: Manual Discovery Dispatch

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms (e.g. upwork,freelancer,onlinejobs_ph)'
        required: false
        default: 'upwork,freelancer,onlinejobs_ph'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected worker dispatch
        env:
          JOBOPS_WEB_URL: ${{ secrets.JOBOPS_WEB_URL }}
          WORKER_DISPATCH_SECRET: ${{ secrets.WORKER_DISPATCH_SECRET }}
        run: |
          if [ -z "$JOBOPS_WEB_URL" ] || [ -z "$WORKER_DISPATCH_SECRET" ]; then
            echo "JOBOPS_WEB_URL or WORKER_DISPATCH_SECRET not set; skipping dispatch."
            exit 0
          fi
          curl -fsS -X POST "${JOBOPS_WEB_URL}/api/worker/dispatch" \
            -H "Authorization: Bearer ${WORKER_DISPATCH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"triggerType":"manual"}'
