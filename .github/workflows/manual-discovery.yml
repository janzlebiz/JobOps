name: Manual Discovery Dispatch

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms (e.g. upwork,freelancer,onlinejobs_ph)'
        required: false
        default: 'upwork,freelancer,onlinejobs_ph'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected worker dispatch
        if: ${{ secrets.JOBOPS_WEB_URL != '' && secrets.WORKER_DISPATCH_SECRET != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.JOBOPS_WEB_URL }}/api/worker/dispatch" \
            -H "Authorization: Bearer ${{ secrets.WORKER_DISPATCH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"triggerType":"manual"}'
